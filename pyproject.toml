[project]
name = "plotpilot"
version = "1.0.2"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]

[tool.pytest.ini_options.markers]
unit = "unit tests"
integration = "integration tests"
slow = "slow tests"
