id: chapter-prose-generation
name: 工作台正文生成
category: generation
source: ai_invocation/chapter.generate.prose
description: 通过 AI Invocation 审阅面板按章节执行剧本一次性生成完整单章正文，prompt 正文完全由 CPMS 管理。
builtin: true
tags:
  - 工作台
  - 正文生成
  - AI Invocation
variables:
  - name: novel_title
    desc: 小说标题
    type: string
    required: false
    default: ''
  - name: genre
    desc: 题材
    type: string
    required: false
    default: ''
  - name: writing_style
    desc: 写作风格
    type: string
    required: false
    default: ''
  - name: style_guide
    desc: 风格指南
    type: string
    required: false
    default: ''
  - name: voice_anchors
    desc: 声线锚点
    type: string
    required: false
    default: ''
  - name: genre_opening_profile
    desc: 类型开篇画像
    type: object
    required: false
    default: {}
  - name: genre_reader_contract
    desc: 读者契约
    type: object
    required: false
    default: {}
  - name: genre_rhythm_constraints
    desc: 节奏约束
    type: object
    required: false
    default: {}
  - name: target_words
    desc: 文章目标字数
    type: integer
    required: false
    default: 2500
  - name: chapter_outline
    desc: 正文细纲
    type: string
    required: true
  - name: continuity_context
    desc: 连续性上下文，默认使用近3章承接摘要
    type: string
    required: false
    default: ''
output_format: text
sort_order: 10
