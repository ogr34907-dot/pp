<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlotPilot | AI 小说创作平台</title>
    <style>
      /* 首屏：在 JS/Vue 挂载前即可显示，避免桌面壳等后端时纯白窗口 */
      :root {
        --boot-page: #F4EFE6;
        --boot-surface: #FFFCF6;
        --boot-text: #2C2520;
        --boot-muted: #8B7F75;
        --boot-brand: #A64B2A;
        --boot-brand-soft: rgba(166, 75, 42, 0.16);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-page: #221C19;
          --boot-surface: #2B2420;
          --boot-text: #F6EEDF;
          --boot-muted: #AA9C90;
          --boot-brand: #E28B62;
          --boot-brand-soft: rgba(226, 139, 98, 0.2);
        }
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: var(--boot-page);
        color: var(--boot-text);
        font-family: system-ui, 'Segoe UI', 'Noto Sans SC', sans-serif;
        z-index: 2147483647;
      }
      #boot-splash .boot-logo {
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #boot-splash .boot-hint {
        font-size: 0.875rem;
        color: var(--boot-muted);
      }
      #boot-splash .boot-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid var(--boot-brand-soft);
        border-top-color: var(--boot-brand);
        border-radius: 50%;
        animation: boot-spin 0.85s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-splash" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <div class="boot-logo">PlotPilot</div>
        <div class="boot-hint">正在启动本地服务，请稍候…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
